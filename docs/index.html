<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>trackEat: how accurately Claude counts calories from photos</title>
<meta name="description" content="Benchmark of Claude Haiku, Sonnet and Opus 5.5 on 35 food photos with known calories: accuracy, effort levels, what to send with the photo, cost.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2320A67A'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#fbfaf7;--panel:#fff;--fg:#1d1d1b;--muted:#6b6a64;--line:#e4e2da;--grid:#ecebe4;--accent:#20a67a;
  --haiku:#d97757;--sonnet:#3b82c4;--opus:#8b5cc6;--ok:#1a8a5f;--bad:#c2410c;
  --serif:Georgia,"Times New Roman",serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#181816;--panel:#222220;--fg:#efeee9;--muted:#a3a29a;--line:#36352f;--grid:#2d2c27;
  --haiku:#e8896b;--sonnet:#5a9ddb;--opus:#a583dc;--ok:#4cc79a;--bad:#f08a5a;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 var(--sans)}
main{max-width:1060px;margin:0 auto;padding:28px 16px 80px;display:flex;flex-direction:column;gap:44px}
h1{font:400 clamp(1.9rem,4.5vw,2.8rem)/1.12 var(--serif);margin:0;text-wrap:balance}
h2{font-size:1.3rem;font-weight:600;margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--accent)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.top nav{display:flex;gap:14px;flex-wrap:wrap}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{background:var(--panel);color:var(--fg);border:0;padding:5px 12px;cursor:pointer;font:inherit}
.lang button[aria-pressed=true]{background:var(--accent);color:#fff}
.eyebrow{font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.head{display:flex;flex-direction:column;gap:12px}
.lede{font-size:1.1rem;max-width:70ch}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:4px}
.tile .k{font-size:.85rem;color:var(--muted)}
.tile .v{font:400 2.4rem/1.1 var(--serif);font-variant-numeric:tabular-nums}
.tile .who{font-weight:600;font-size:.95rem}
.tile .sub{font-size:.82rem;color:var(--muted)}
section{display:flex;flex-direction:column;gap:14px}
.note{color:var(--muted);font-size:.88rem;max-width:80ch}
.chart{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.chart canvas{width:100%!important}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:.88rem;color:var(--muted)}
select{font:inherit;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.scroll{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.85rem;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--muted)}
tr:last-child td{border-bottom:0}
td small{display:block;color:var(--muted);font-size:.8em}
.heat td{min-width:84px}
td.bad{color:var(--bad)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font-size:1rem}
.card ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:5px}
details{border-top:1px solid var(--line);padding-top:14px}
summary{cursor:pointer;font-weight:600}
details .in{display:flex;flex-direction:column;gap:12px;margin-top:12px;max-width:80ch}
details ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:5px}
footer{font-size:.85rem;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<main>
  <div class="top">
    <nav>
      <a href="https://github.com/ArtemkaGoldMan/trackEat">GitHub</a>
      <a href="#scen" data-i18n="nav_scen"></a>
      <a href="#dish" data-i18n="nav_dish"></a>
      <a href="#snack" data-i18n="nav_snack"></a>
      <a href="#table" data-i18n="nav_table"></a>
      <a href="#method" data-i18n="nav_method"></a>
    </nav>
    <div class="lang" role="group" aria-label="Language">
      <button id="l-en" aria-pressed="true">English</button><button id="l-uk" aria-pressed="false">Українська</button>
    </div>
  </div>

  <header class="head">
    <p class="eyebrow" id="eyebrow"></p>
    <h1 data-i18n="title"></h1>
    <p class="lede" id="takeaway"></p>
  </header>

  <section class="tiles" id="tiles"></section>

  <section id="scen">
    <h2 data-i18n="scen_h"></h2>
    <p class="note" data-i18n="scen_n"></p>
    <div class="chart"><canvas id="c-scen" height="250"></canvas></div>
  </section>

  <section id="dish">
    <h2 data-i18n="dish_h"></h2>
    <p class="note" data-i18n="dish_n"></p>
    <div class="chart"><canvas id="c-dish" height="330"></canvas></div>
  </section>

  <section id="snack">
    <h2 data-i18n="snack_h"></h2>
    <p class="note" data-i18n="snack_n"></p>
    <div class="chart"><canvas id="c-snack" height="330"></canvas></div>
    <div class="controls"><label for="snack-eff" data-i18n="effort_in_table"></label>
      <select id="snack-eff"><option>low</option><option selected>medium</option><option>high</option></select>
      <span data-i18n="snack_tbl_n"></span></div>
    <div class="scroll"><table id="snack-table"></table></div>
  </section>

  <section id="modes">
    <h2 data-i18n="modes_h"></h2>
    <p class="note" data-i18n="modes_n"></p>
    <div class="chart"><canvas id="c-modes" height="300"></canvas></div>
  </section>

  <section id="daily">
    <h2 data-i18n="daily_h"></h2>
    <p class="note" data-i18n="daily_n"></p>
    <div class="chart"><canvas id="c-daily" height="260"></canvas></div>
  </section>

  <section id="items">
    <h2 data-i18n="items_h"></h2>
    <div class="controls"><label for="heat-mode" data-i18n="mode_lbl"></label><select id="heat-mode"></select>
      <span data-i18n="items_n"></span></div>
    <div class="scroll"><table id="heat" class="heat"></table></div>
  </section>

  <section id="cost">
    <h2 data-i18n="cost_h"></h2>
    <p class="note" data-i18n="cost_n"></p>
    <div class="chart"><canvas id="c-cost" height="300"></canvas></div>
  </section>

  <section id="table">
    <h2 data-i18n="table_h"></h2>
    <div class="controls"><label for="sum-view" data-i18n="set_lbl"></label><select id="sum-view"></select></div>
    <div class="scroll"><table id="sum-table"></table></div>
    <p class="note" data-i18n="table_n"></p>
  </section>

  <section id="advice">
    <h2 data-i18n="advice_h"></h2>
    <div class="cards" id="advice-cards"></div>
  </section>

  <details id="method">
    <summary data-i18n="method_h"></summary>
    <div class="in" id="method-body"></div>
  </details>

  <footer id="foot"></footer>
</main>

  afterDatasetsDraw(chart) {
    const horizontal = chart.options.indexAxis === "y";
    const ctx = chart.ctx; ctx.save(); ctx.strokeStyle = cssv("--fg"); ctx.lineWidth = 1.4;
    chart.data.datasets.forEach((ds, di) => {
      if (!ds.ci) return;
      const meta = chart.getDatasetMeta(di);
      meta.data.forEach((bar, i) => {
        const ci = ds.ci[i]; if (!ci) return;
        const sc = horizontal ? chart.scales.x : chart.scales.y;
        const a = sc.getPixelForValue(ci[0]), b = sc.getPixelForValue(ci[1]), p = horizontal ? bar.y : bar.x, h = 4;
        ctx.beginPath();
        if (horizontal) { ctx.moveTo(a, p); ctx.lineTo(b, p); ctx.moveTo(a, p - h); ctx.lineTo(a, p + h); ctx.moveTo(b, p - h); ctx.lineTo(b, p + h); }
        else { ctx.moveTo(p, a); ctx.lineTo(p, b); ctx.moveTo(p - h, a); ctx.lineTo(p + h, a); ctx.moveTo(p - h, b); ctx.lineTo(p + h, b); }
        ctx.stroke();
      });
    });
    const ref = chart.options.plugins.refLine;
    if (ref && ref.value != null) {
      const sc = horizontal ? chart.scales.x : chart.scales.y, v = sc.getPixelForValue(ref.value), ca = chart.chartArea;
      ctx.setLineDash([4, 4]); ctx.strokeStyle = cssv("--muted"); ctx.beginPath();
      if (horizontal) { ctx.moveTo(v, ca.top); ctx.lineTo(v, ca.bottom); } else { ctx.moveTo(ca.left, v); ctx.lineTo(ca.right, v); }
      ctx.stroke();
    }
    ctx.restore();
  }
};
Chart.register(whiskers);

const charts = {};
function mk(id, cfg) {
  if (charts[id]) charts[id].destroy();
  const muted = cssv("--muted"), grid = cssv("--grid");
  cfg.options = cfg.options || {};
  cfg.options.responsive = true;
  cfg.options.animation = false;
  cfg.options.color = muted;
  cfg.options.plugins = Object.assign({legend: {labels: {color: muted, boxWidth: 12}}}, cfg.options.plugins || {});
  for (const ax of Object.values(cfg.options.scales || {})) {
    ax.grid = Object.assign({color: grid}, ax.grid || {});
    ax.ticks = Object.assign({color: muted}, ax.ticks || {});
    if (ax.title) ax.title.color = muted;
  }
  charts[id] = new Chart(document.getElementById(id), cfg);
}
const ordered = (rows) => rows.slice().sort((a, b) => MODELS.indexOf(a.model) - MODELS.indexOf(b.model) || EFFORTS.indexOf(a.effort) - EFFORTS.indexOf(b.effort));

function barsFor(setName, id) {
  const rows = ordered(S.filter((r) => r.set === setName && r.mode === "photo"));
  mk(id, {
    type: "bar",
    data: {labels: rows.map((r) => r.label), datasets: [{
      data: rows.map((r) => r.mape), ci: rows.map((r) => [r.mape_lo, r.mape_hi]),
      backgroundColor: rows.map((r) => cfgColor(r.model, r.effort)), borderRadius: 3}]},
    options: {indexAxis: "y", plugins: {legend: {display: false}, refLine: {value: 20},
      tooltip: {callbacks: {label: (c) => { const r = rows[c.dataIndex]; return `${pct(r.mape)} (95% CI ${nf(r.mape_lo)}–${nf(r.mape_hi)}), ≤20%: ${nf(r.within20, 0)}%`; }}}},
      scales: {x: {beginAtZero: true, title: {display: true, text: t().err_axis}}, y: {grid: {display: false}}}}
  });
}

function scenChart() {
  const modes = MODES;
  const ds = ["sonnet", "opus"].map((m) => {
    const rows = modes.map((md) => sRow(`dish|${md}|${m}|low`));
    return {label: MODEL_NAME[m] + " · low", data: rows.map((r) => r && r.mape), ci: rows.map((r) => r && [r.mape_lo, r.mape_hi]),
      backgroundColor: modelColor(m), borderRadius: 3};
  });
  mk("c-scen", {type: "bar", data: {labels: modes.map((m) => t().mode_names[m]), datasets: ds},
    options: {indexAxis: "y", plugins: {tooltip: {callbacks: {label: (c) => `${c.dataset.label}: ${pct(c.parsed.x)}`}}},
      scales: {x: {beginAtZero: true, title: {display: true, text: t().err_axis}}, y: {grid: {display: false}}}}});
}

function modesChart() {
  const rows = ordered(S.filter((r) => r.set === "dish" && r.mode === "photo"));
  const ds = rows.map((c) => ({label: c.label, data: MODES.map((md) => { const r = sRow(`dish|${md}|${c.model}|${c.effort}`); return r ? r.mape : null; }),
    backgroundColor: cfgColor(c.model, c.effort), borderRadius: 2}));
  mk("c-modes", {type: "bar", data: {labels: MODES.map((m) => t().mode_short[m]), datasets: ds},
    options: {plugins: {legend: {labels: {color: cssv("--muted"), boxWidth: 10, font: {size: 11}}}, tooltip: {callbacks: {label: (c) => `${c.dataset.label}: ${pct(c.parsed.y)}`}}},
      scales: {y: {beginAtZero: true, title: {display: true, text: t().err_axis}}, x: {grid: {display: false}}}}});
}

function dailyChart() {
  const ds = MODELS.map((m) => ({label: MODEL_NAME[m] + " · low",
    data: MODES.map((md) => { const r = dRow(`day|${md}|${m}|low`); return r ? r.day_mape : null; }),
    backgroundColor: modelColor(m), borderRadius: 3}));
  mk("c-daily", {type: "bar", data: {labels: MODES.map((m) => t().mode_short[m]), datasets: ds},
    options: {plugins: {tooltip: {callbacks: {label: (c) => `${c.dataset.label}: ${pct(c.parsed.y)}`}}},
      scales: {y: {beginAtZero: true, title: {display: true, text: t().day_axis}}, x: {grid: {display: false}}}}});
}

function costChart() {
  const rows = S.filter((r) => r.set === "dish" && r.mode === "photo");
  const ds = MODELS.map((m) => ({label: MODEL_NAME[m], backgroundColor: modelColor(m), borderColor: modelColor(m), pointRadius: 7, pointHoverRadius: 9,
    data: rows.filter((r) => r.model === m).map((r) => ({x: r.cost_per_1000, y: r.mape, label: r.label}))}));
  mk("c-cost", {type: "scatter", data: {datasets: ds},
    options: {plugins: {tooltip: {callbacks: {label: (c) => `${c.raw.label}: ${pct(c.raw.y)}, $${nf(c.raw.x, 2)} / 1000`}}},
      scales: {x: {type: "logarithmic", title: {display: true, text: t().cost_axis}, ticks: {callback: (v) => ([1, 2, 5, 10, 20, 50].includes(v) ? "$" + v : "")}},
        y: {beginAtZero: true, title: {display: true, text: t().err_axis}}}}});
}

function heat() {
  const mode = document.getElementById("heat-mode").value;
  const cfgs = ordered(S.filter((r) => r.set === "dish" && r.mode === mode));
  const its = DATA.dataset.filter((d) => d.set === "dish");
  const el = document.getElementById("heat");
  let h = `<thead><tr><th>${t().product}</th><th>${t().truth}</th>${cfgs.map((c) => `<th>${c.label}</th>`).join("")}</tr></thead><tbody>`;
  for (const d of its) {
    h += `<tr><td>${d["name_" + lang]}</td><td>${nf(d.gt_kcal, 0)}</td>`;
    for (const c of cfgs) {
      const r = DATA.items.find((x) => x.item === d.item && x.mode === mode && x.model === c.model && x.effort === c.effort);
      if (!r) { h += "<td></td>"; continue; }
      const v = r.err_median_pct, a = Math.min(Math.abs(v) / 100, 1) * .75;
      const col = v >= 0 ? `rgba(220,90,50,${a})` : `rgba(60,130,200,${a})`;
      h += `<td style="background:${col}">${v > 0 ? "+" : v < 0 ? "−" : ""}${nf(Math.abs(v), 0)}</td>`;
    }
    h += "</tr>";
  }
  el.innerHTML = h + "</tbody>";
}

function snackTable() {
  const eff = document.getElementById("snack-eff").value;
  const sn = DATA.dataset.filter((d) => d.set === "snack");
  let h = `<thead><tr><th>${t().product}</th><th>${t().truth}</th>${MODELS.map((m) => `<th>${MODEL_NAME[m]}</th>`).join("")}</tr></thead><tbody>`;
  for (const d of sn) {
    h += `<tr><td>${d["name_" + lang]}</td><td>${nf(d.gt_kcal, 0)}</td>`;
    for (const m of MODELS) {
      const r = DATA.items.find((x) => x.item === d.item && x.mode === "photo" && x.model === m && x.effort === eff);
      if (!r) { h += "<td></td>"; continue; }
      const bad = Math.abs(r.err_median_pct) > 20;
      h += `<td class="${bad ? "bad" : ""}">${nf(r.median, 0)}<small>${nf(r.min, 0)}–${nf(r.max, 0)}</small></td>`;
    }
    h += "</tr>";
  }
  document.getElementById("snack-table").innerHTML = h + "</tbody>";
}

function sumTable() {
  const [set, mode] = document.getElementById("sum-view").value.split("|");
  const rows = ordered(S.filter((r) => r.set === set && r.mode === mode));
  const best = Math.min(...rows.map((r) => r.mape));
  document.getElementById("sum-table").innerHTML =
    `<thead><tr>${t().cols.map((c) => `<th>${c}</th>`).join("")}</tr></thead><tbody>` +
    rows.map((r) => `<tr><td>${r.label}</td><td style="font-weight:${r.mape === best ? 700 : 400};color:${r.mape === best ? "var(--ok)" : "inherit"}">${nf(r.mape)}</td>` +
      `<td>${nf(r.mape_lo)}–${nf(r.mape_hi)}</td><td>${nf(r.within10, 0)}%</td><td>${nf(r.within20, 0)}%</td>` +
      `<td>${r.bias > 0 ? "+" : ""}${nf(r.bias)}</td><td>${nf(r.cv)}</td><td>${nf(r.wape_protein)}</td><td>${nf(r.wape_fat)}</td><td>${nf(r.wape_carbs)}</td>` +
      `<td>${nf(r.latency_s)}</td><td>${nf(r.cost_per_1000, 2)}</td></tr>`).join("") + "</tbody>";
}

function fillSelects() {
  const hm = document.getElementById("heat-mode"), cur = hm.value || "photo";
  hm.innerHTML = MODES.map((m) => `<option value="${m}">${t().mode_names[m]}</option>`).join(""); hm.value = cur;
  const sv = document.getElementById("sum-view"), cv = sv.value || "dish|photo";
  sv.innerHTML = MODES.map((m) => `<option value="dish|${m}">${t().set_names.dish}, ${t().mode_names[m].toLowerCase()}</option>`).join("") +
    `<option value="snack|photo">${t().set_names.snack}, ${t().mode_names.photo.toLowerCase()}</option>`; sv.value = cv;
}

function tiles() {
  const g = (c) => sRow(c), d = (c) => dRow(c);
  const items = [
    ["tile_photo", g("dish|photo|sonnet|low"), true], ["tile_main", g("dish|main_weight|sonnet|low")], ["tile_all", g("dish|weighed|sonnet|low")]];
  let h = items.map(([k, r, first]) => `<div class="tile"><span class="k">${t()[k]}</span><span class="v">${pct(r.mape)}</span><span class="who">Sonnet 5.5 · low</span><span class="sub">${first ? t().tile_sub_ci(nf(r.mape_lo), nf(r.mape_hi)) : t().tile_ci(nf(r.mape_lo), nf(r.mape_hi))}</span></div>`).join("");
  h += `<div class="tile"><span class="k">${t().tile_day}</span><span class="v">${pct(d("day|photo|sonnet|low").day_mape)}</span><span class="who">Sonnet 5.5 · low</span><span class="sub">${t().tile_day_sub(pct(d("day|main_weight|sonnet|low").day_mape))}</span></div>`;
  document.getElementById("tiles").innerHTML = h;
  document.getElementById("takeaway").innerHTML = t().takeaway(
    pct(g("dish|photo|sonnet|low").mape), pct(g("dish|main_weight|sonnet|low").mape), pct(g("dish|weighed|sonnet|low").mape), pct(d("day|photo|sonnet|low").day_mape));
}

function render() {
  document.documentElement.lang = lang;
  document.title = lang === "uk" ? "trackEat: наскільки точно Claude рахує калорії з фото" : "trackEat: how accurately Claude counts calories from photos";
  document.querySelectorAll("[data-i18n]").forEach((e) => { e.textContent = t()[e.dataset.i18n]; });
  document.getElementById("eyebrow").textContent = t().eyebrow(DATA.runs);
  document.getElementById("l-en").setAttribute("aria-pressed", lang === "en");
  document.getElementById("l-uk").setAttribute("aria-pressed", lang === "uk");
  document.getElementById("advice-cards").innerHTML = t().advice.map(([h, li]) => `<div class="card"><h3>${h}</h3><ul>${li.map((x) => `<li>${x}</li>`).join("")}</ul></div>`).join("");
  document.getElementById("method-body").innerHTML = t().method.join("");
  document.getElementById("runs-n").textContent = DATA.runs.toLocaleString(lang === "uk" ? "uk" : "en");
  document.getElementById("foot").innerHTML = t().foot;
  fillSelects(); tiles(); scenChart(); barsFor("dish", "c-dish"); barsFor("snack", "c-snack");
  modesChart(); dailyChart(); costChart(); heat(); snackTable(); sumTable();
}
document.getElementById("l-en").onclick = () => { lang = "en"; try { localStorage.setItem("lang", lang); } catch (e) {} render(); };
document.getElementById("l-uk").onclick = () => { lang = "uk"; try { localStorage.setItem("lang", lang); } catch (e) {} render(); };
document.getElementById("heat-mode").onchange = heat;
document.getElementById("snack-eff").onchange = snackTable;
document.getElementById("sum-view").onchange = sumTable;
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
render();
</script>
